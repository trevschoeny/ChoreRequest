<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Chore Quest">
<meta name="theme-color" content="#F3F5FB">
<title>Chore Quest</title>
<style>
  :root{
    --bg:#F3F5FB; --card:#FFFFFF; --ink:#26314A; --muted:#8A93A6;
    --line:#E7EAF3; --gold:#FFB020; --gold-ink:#B26A00;
    --k1:#FF6B6B; --k1-soft:#FFE7E4;
    --k2:#12B5A5; --k2-soft:#D6F5F0;
    --k3:#7C6BFF; --k3-soft:#E9E6FF;
    --shadow:0 6px 20px rgba(38,49,74,.08);
    --shadow-lg:0 14px 40px rgba(38,49,74,.14);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0; padding:0; height:100%; background:var(--bg); color:var(--ink);
    font-family:ui-rounded,"SF Pro Rounded",system-ui,-apple-system,"Segoe UI",sans-serif;
    -webkit-text-size-adjust:100%; overscroll-behavior:none;}
  body{padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);}
  #app{max-width:1024px; margin:0 auto; padding:20px 20px 48px;}
  button{font-family:inherit; cursor:pointer; border:none; background:none; color:inherit;}
  input,select{font-family:inherit; font-size:16px;}

  /* ---------- HOME ---------- */
  .home-head{display:flex; align-items:baseline; justify-content:space-between; margin:8px 4px 22px; gap:12px; flex-wrap:wrap;}
  .brand{font-size:34px; font-weight:800; letter-spacing:-.5px;}
  .brand .spark{color:var(--gold);}
  .home-sub{color:var(--muted); font-weight:600; font-size:17px; margin:-6px 4px 24px;}
  .kid-grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(220px,1fr)); gap:18px;}
  .kid-card{background:var(--card); border-radius:26px; padding:26px 22px; box-shadow:var(--shadow);
    display:flex; flex-direction:column; align-items:center; gap:14px; border:2px solid transparent;
    transition:transform .12s ease, box-shadow .12s ease; text-align:center;}
  .kid-card:active{transform:scale(.97);}
  .kid-face{width:96px; height:96px; border-radius:50%; display:grid; place-items:center; font-size:52px;}
  .kid-name{font-size:26px; font-weight:800;}
  .kid-meta{color:var(--muted); font-weight:700; font-size:15px;}
  .coin-badge{font-weight:800; font-size:28px; padding:12px 26px; border-radius:18px; line-height:1;}
  .grown{margin:34px auto 0; display:block; background:var(--card); color:var(--muted);
    font-weight:800; font-size:16px; padding:14px 22px; border-radius:16px; box-shadow:var(--shadow);}
  .ver{text-align:center; color:var(--muted); opacity:.55; font-weight:700; font-size:12px; margin-top:16px;}

  /* ---------- KID DAY ---------- */
  .bar{display:flex; align-items:center; gap:12px; margin:4px 0 18px;}
  .iconbtn{background:var(--card); box-shadow:var(--shadow); border-radius:16px; padding:12px 16px;
    font-weight:800; font-size:17px; display:inline-flex; align-items:center; gap:8px;}
  .iconbtn:active{transform:scale(.96);}
  .spacer{flex:1;}
  .hero{background:var(--card); border-radius:26px; padding:22px 24px; box-shadow:var(--shadow);
    display:flex; align-items:center; gap:20px; margin-bottom:24px; flex-wrap:wrap;}
  .hero .face{width:72px; height:72px; border-radius:50%; display:grid; place-items:center; font-size:40px; flex-shrink:0;}
  .hero .who{flex:1; min-width:160px;}
  .hero .hi{font-size:26px; font-weight:800;}
  .hero .day{color:var(--muted); font-weight:700; font-size:15px;}
  .coin{text-align:right;}
  .coin .big{font-size:34px; font-weight:800; color:var(--gold-ink); line-height:1;}
  .coin .lbl{color:var(--muted); font-weight:700; font-size:13px;}

  .section-title{font-size:20px; font-weight:800; margin:26px 4px 12px; display:flex; align-items:center; gap:8px;}
  .section-title small{color:var(--muted); font-weight:700; font-size:14px;}
  .chore-list{display:grid; grid-template-columns:repeat(auto-fill,minmax(240px,1fr)); gap:14px;}
  .chore{position:relative; background:var(--card); border-radius:20px; padding:18px 18px 18px 66px;
    box-shadow:var(--shadow); min-height:78px; display:flex; flex-direction:column; justify-content:center;
    border:2px solid var(--line); transition:transform .12s ease, border-color .15s ease, background .2s ease;
    overflow:hidden;}
  .chore:active{transform:scale(.97);}
  .chore .box{position:absolute; left:16px; top:50%; transform:translateY(-50%);
    width:38px; height:38px; border-radius:12px; border:3px solid var(--line);
    display:grid; place-items:center; font-size:22px; color:#fff; background:transparent;
    transition:background .18s ease, border-color .18s ease, transform .18s ease;}
  .chore .name{font-weight:800; font-size:17px; line-height:1.15;}
  .chore .pay{color:var(--muted); font-weight:700; font-size:13px; margin-top:2px;}
  .chore .emoji{font-size:15px; margin-right:4px;}
  .chore.done{border-color:transparent;}
  .chore.done .box{border-color:transparent;}
  .chore.done .name{opacity:.55; text-decoration:line-through; text-decoration-thickness:2px;}
  .float{position:absolute; right:14px; top:14px; font-weight:800; color:var(--gold-ink); font-size:16px;
    opacity:0; pointer-events:none;}
  .pop{animation:pop .3s ease;}
  @keyframes pop{0%{transform:scale(1)}45%{transform:scale(1.06)}100%{transform:scale(1)}}
  .rise{animation:rise .8s ease forwards;}
  @keyframes rise{0%{opacity:0; transform:translateY(6px)}20%{opacity:1}100%{opacity:0; transform:translateY(-22px)}}

  .bonus-list{display:grid; grid-template-columns:repeat(auto-fill,minmax(260px,1fr)); gap:14px;}
  .bonus{background:var(--card); border-radius:20px; padding:16px 18px; box-shadow:var(--shadow);
    display:flex; align-items:center; gap:14px; border:2px solid var(--line);}
  .bonus .info{flex:1; min-width:0;}
  .bonus .name{font-weight:800; font-size:17px;}
  .bonus .pay{color:var(--muted); font-weight:700; font-size:13px;}
  .stepper{display:flex; align-items:center; gap:10px;}
  .step{width:42px; height:42px; border-radius:14px; background:var(--line); font-size:24px; font-weight:800;
    display:grid; place-items:center; color:var(--ink);}
  .step:active{transform:scale(.92);}
  .count{min-width:26px; text-align:center; font-weight:800; font-size:22px;}
  .empty{color:var(--muted); font-weight:700; padding:18px 4px;}

  /* ---------- PARENT ---------- */
  .p-head{display:flex; align-items:center; gap:12px; margin-bottom:18px; flex-wrap:wrap;}
  .p-title{font-size:26px; font-weight:800;}
  .tabs{display:flex; gap:8px; flex-wrap:wrap; margin-bottom:20px;}
  .tab{padding:11px 18px; border-radius:14px; font-weight:800; font-size:15px; color:var(--muted); background:var(--card); box-shadow:var(--shadow);}
  .tab.active{color:#fff; background:var(--ink);}
  .panel{background:var(--card); border-radius:22px; padding:20px; box-shadow:var(--shadow); margin-bottom:18px;}
  .panel h3{margin:0 0 4px; font-size:19px; font-weight:800;}
  .panel .hint{color:var(--muted); font-weight:700; font-size:14px; margin:0 0 16px;}
  .row{display:flex; align-items:center; gap:12px; padding:12px 0; border-top:1px solid var(--line); flex-wrap:wrap;}
  .row:first-of-type{border-top:none;}
  .field{display:flex; flex-direction:column; gap:5px;}
  .field label{font-size:12px; font-weight:800; color:var(--muted); text-transform:uppercase; letter-spacing:.4px;}
  .in{border:2px solid var(--line); border-radius:12px; padding:11px 12px; font-weight:700; background:#fff; color:var(--ink);}
  .in:focus{outline:none; border-color:var(--ink);}
  .in.name{width:150px;} .in.emoji{width:64px; text-align:center; font-size:22px;}
  .in.money{width:92px;} .in.pct{width:74px;}
  select.in{width:130px;}
  .days{display:flex; gap:6px; flex-wrap:wrap;}
  .day{width:38px; height:38px; border-radius:11px; background:var(--line); color:var(--muted); font-weight:800; font-size:14px; display:grid; place-items:center;}
  .day.on{background:var(--ink); color:#fff;}
  .btn{padding:11px 16px; border-radius:13px; font-weight:800; font-size:15px; background:var(--ink); color:#fff;}
  .btn:active{transform:scale(.97);}
  .btn.ghost{background:var(--line); color:var(--ink);}
  .btn.warn{background:#FFE7E4; color:#C0392B;}
  .btn.add{background:var(--k2-soft); color:#0C7A6E;}
  .del{margin-left:auto; color:#C0392B; font-weight:800; font-size:14px; background:#FFE7E4; padding:9px 13px; border-radius:11px;}
  .money-grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(200px,1fr)); gap:14px; margin-top:6px;}
  .mcard{border:2px solid var(--line); border-radius:18px; padding:16px;}
  .mcard .mname{font-weight:800; font-size:18px; margin-bottom:10px; display:flex; align-items:center; gap:8px;}
  .mline{display:flex; justify-content:space-between; padding:6px 0; font-weight:700;}
  .mline.total{border-top:2px solid var(--line); margin-top:6px; padding-top:10px; font-size:18px;}
  .mline .v{font-weight:800;}
  .deposit{background:var(--gold); color:#5c3d00; border-radius:18px; padding:18px 20px; margin-top:16px;
    display:flex; align-items:center; justify-content:space-between; font-weight:800;}
  .deposit .amt{font-size:30px;}
  .history .hrow{display:flex; justify-content:space-between; padding:9px 0; border-top:1px solid var(--line); font-weight:700; font-size:14px;}
  .paybtn{margin-top:12px; width:100%;}
  .hitem{padding:12px 0; border-top:2px solid var(--line);}
  .hitem:first-of-type{border-top:none;}
  .hweek{font-weight:800; font-size:15px; display:flex; justify-content:space-between; align-items:baseline; margin-bottom:2px;}
  .hdep{font-weight:700; font-size:13px; color:var(--gold-ink);}
  .paidtag{background:var(--k2-soft); color:#0C7A6E; font-size:11px; font-weight:800; padding:2px 7px; border-radius:8px; text-transform:uppercase; letter-spacing:.4px;}
  .hright{white-space:nowrap;}
  .histpay{font-weight:800; font-size:12px; padding:4px 10px; border-radius:9px; background:var(--line); color:var(--muted); margin-left:6px;}
  .histpay.on{background:var(--k2-soft); color:#0C7A6E;}
  .toast{position:fixed; left:50%; bottom:26px; transform:translateX(-50%) translateY(20px); background:var(--ink); color:#fff;
    padding:13px 20px; border-radius:14px; font-weight:800; box-shadow:var(--shadow-lg); opacity:0; transition:.25s; z-index:50;}
  .toast.show{opacity:1; transform:translateX(-50%) translateY(0);}
  .keypad{display:grid; grid-template-columns:repeat(3,1fr); gap:12px; max-width:280px; margin:18px auto;}
  .key{background:var(--card); box-shadow:var(--shadow); border-radius:16px; padding:18px; font-size:24px; font-weight:800;}
  .key:active{transform:scale(.95);}
  .pin-dots{display:flex; gap:14px; justify-content:center; margin:10px 0 4px;}
  .pin-dots i{width:16px; height:16px; border-radius:50%; background:var(--line);}
  .pin-dots i.f{background:var(--ink);}
  .center{text-align:center;}
  @media (prefers-reduced-motion:reduce){*{animation:none!important; transition:none!important;}}
</style>
</head>
<body>
<div id="app"></div>
<div id="toast" class="toast"></div>
<script>
(function(){
"use strict";

/* ---------------- storage ---------------- */
var KEY="choreQuest.v3";
var VERSION="v7 · QA-hardened";
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(state)); }catch(e){} }
function load(){ try{ var r=localStorage.getItem(KEY); return r?JSON.parse(r):null; }catch(e){ return null; } }

/* ---------------- dates ---------------- */
var DOW=["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
var DOWFULL=["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];
function iso(d){ return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
function today(){ return new Date(); }
function weekStartOf(d){ var x=new Date(d); x.setHours(0,0,0,0); var off=(x.getDay()+6)%7; x.setDate(x.getDate()-off); return x; } // Monday
function weekDatesFor(startISO){ var s=startISO?new Date(startISO+"T12:00:00"):weekStartOf(today()); var a=[]; for(var i=0;i<7;i++){ var d=new Date(s); d.setDate(s.getDate()+i); a.push({iso:iso(d),dow:d.getDay()}); } return a; }
function money(n){ return "$"+(Math.round(n*100)/100).toFixed(2); }
function monthYear(s){ var M=["January","February","March","April","May","June","July","August","September","October","November","December"]; var d=new Date(s+"T12:00:00"); return M[d.getMonth()]+" "+d.getFullYear(); }
function uid(){ return Math.random().toString(36).slice(2,9); }

/* ---------------- defaults ---------------- */
function defaults(){
  return {
    version:3,
    sound:true,
    investPercent:50,
    _invest50:true,
    _bonusV2:true,
    _emoji2:true,
    pin:"",
    kids:[
      {id:"k1",name:"Jackson",emoji:"🏀",colorVar:"--k1"},
      {id:"k2",name:"Aubrey",emoji:"👸",colorVar:"--k2"},
      {id:"k3",name:"Samuel",emoji:"⚾",colorVar:"--k3"}
    ],
    core:[
      {id:uid(),name:"Make your bed",emoji:"🛏️",value:0.25,days:[0,1,2,3,4,5,6],who:"all"},
      {id:uid(),name:"Unpack backpack & homework",emoji:"🎒",value:0.25,days:[1,2,3,4,5],who:"all"},
      {id:uid(),name:"Feed the dogs",emoji:"🐕",value:0.25,days:[0,1,2,3,4,5,6],who:"all"},
      {id:uid(),name:"Feed the cats",emoji:"🐈",value:0.25,days:[0,1,2,3,4,5,6],who:"all"},
      {id:uid(),name:"Load / unload dishwasher",emoji:"🍽️",value:0.5,days:[0,1,2,3,4,5,6],who:"all"},
      {id:uid(),name:"Tidy your room",emoji:"🧹",value:0.25,days:[0,1,2,3,4,5,6],who:"all"},
      {id:uid(),name:"Empty Jarvis & return to dock",emoji:"🤖",value:0.25,days:[1,4],who:"all"},
      {id:uid(),name:"Take bins to the curb",emoji:"🗑️",value:0.5,days:[1],who:"all"},
      {id:uid(),name:"Bring bins back in",emoji:"🗑️",value:0.5,days:[2],who:"all"}
    ],
    bonus:[
      {id:uid(),name:"Pick up pet waste in yard",emoji:"💩",value:1},
      {id:uid(),name:"Sweep & mop kitchen floor",emoji:"🧹",value:1.5},
      {id:uid(),name:"Wipe down kitchen counters",emoji:"🧼",value:0.75},
      {id:uid(),name:"Fold laundry",emoji:"🧺",value:1.5},
      {id:uid(),name:"Water outdoor plants/garden",emoji:"🪴",value:0.75},
      {id:uid(),name:"Rake leaves / pull weeds",emoji:"🍂",value:2},
      {id:uid(),name:"Wash pet food & water bowls",emoji:"🥣",value:0.5},
      {id:uid(),name:"Wipe down baseboards (per room)",emoji:"🧽",value:1},
      {id:uid(),name:"Wash windows (inside, per window)",emoji:"🪟",value:1.5},
      {id:uid(),name:"Deep clean own bedroom",emoji:"✨",value:2},
      {id:uid(),name:"Clean a toilet",emoji:"🚽",value:2},
      {id:uid(),name:"Give the dogs water",emoji:"💧",value:0.25},
      {id:uid(),name:"Straighten up a room",emoji:"🧸",value:1},
      {id:uid(),name:"Empty bathroom trash & replace bag",emoji:"🗑️",value:0.5},
      {id:uid(),name:"Return Jarvis to his home base",emoji:"🤖",value:0.25}
    ],
    weekStart:iso(weekStartOf(today())),
    since:"2026-09-01", // when lifetime tracking began
    done:{},      // done[kidId][choreId][isoDate] = true
    counts:{},    // counts[kidId][bonusId] = number
    paid:{},      // paid[kidId] = true once handed out this week
    lifetime:{},  // lifetime[kidId] = {earned,invest,keep}
    history:[]    // past week snapshots
  };
}

/* ---------------- state + weekly rollover ---------------- */
var state = load() || defaults();
// backfill any missing keys if loading an older shape
["done","counts","paid","lifetime","history","kids","core","bonus"].forEach(function(k){ if(!state[k]) state[k]=defaults()[k]; });
if(typeof state.investPercent!=="number") state.investPercent=50;
if(!state.since) state.since="2026-09-01";
// migrate earlier saves on this iPad to the latest wording
var realNames={k1:"Jackson",k2:"Aubrey",k3:"Samuel"};
state.kids.forEach(function(k){ if(realNames[k.id] && /^Kid [123]$/.test(k.name)) k.name=realNames[k.id]; });
state.core.forEach(function(c){ if(c.name==="Run Jarvis (the Roomba)") c.name="Empty Jarvis & return to dock"; });
if(!state._invest50){ state.investPercent=50; state._invest50=true; }
if(!state._bonusV2){ state.bonus=defaults().bonus; state._bonusV2=true; }
if(!state._emoji2){
  var em={k1:["🦊","🏀"],k2:["🐢","👸"],k3:["🦉","⚾"]};
  state.kids.forEach(function(k){ if(em[k.id] && k.emoji===em[k.id][0]) k.emoji=em[k.id][1]; });
  state._emoji2=true;
}
// re-anchor to Monday weeks without triggering a surprise reset of the current week
if(!state._mon){ state.weekStart=iso(weekStartOf(today())); state._mon=true; }
save();

function snapshot(startISO){
  var st=startISO||state.weekStart;
  var per=state.kids.map(function(k){
    var e=earned(k.id,st), inv=Math.round(e*state.investPercent)/100;
    return {id:k.id, name:k.name, earned:e, invest:inv, keep:Math.round((e-inv)*100)/100, paid:!!(state.paid&&state.paid[k.id])};
  });
  return {ended:st, on:iso(today()), pct:state.investPercent, per:per,
    deposit:per.reduce(function(s,p){return s+p.invest;},0)};
}
function closeWeek(newStart){
  var oldStart=state.weekStart, inWk={};
  weekDatesFor(oldStart).forEach(function(d){ inWk[d.iso]=1; });
  if(state.kids.some(function(k){ return earned(k.id,oldStart)>0; })){
    var snap=snapshot(oldStart);
    state.history.unshift(snap); state.history=state.history.slice(0,26);
    snap.per.forEach(function(p){
      var L=state.lifetime[p.id]=state.lifetime[p.id]||{earned:0,invest:0,keep:0};
      L.earned=Math.round((L.earned+p.earned)*100)/100;
      L.invest=Math.round((L.invest+p.invest)*100)/100;
      L.keep=Math.round((L.keep+p.keep)*100)/100;
    });
  }
  // clear only the completions that belong to the week being closed
  Object.keys(state.done).forEach(function(kid){
    Object.keys(state.done[kid]).forEach(function(ch){
      Object.keys(state.done[kid][ch]).forEach(function(d){ if(inWk[d]) delete state.done[kid][ch][d]; });
    });
  });
  state.counts={}; state.paid={};
  state.weekStart = newStart || iso(weekStartOf(today()));
  save();
}
(function rolloverAndRecover(){
  var cur=iso(weekStartOf(today()));
  var minD=weekStartOf(today()); minD.setDate(minD.getDate()-56); var minStart=iso(weekStartOf(minD)); // don't reach back more than ~8 weeks
  // recovery: if any completions are older than the stored week, back up so they get logged, not lost
  var earliest=null;
  Object.keys(state.done).forEach(function(kid){
    Object.keys(state.done[kid]).forEach(function(ch){
      Object.keys(state.done[kid][ch]).forEach(function(d){ if(!earliest||d<earliest) earliest=d; });
    });
  });
  if(earliest){ var eStart=iso(weekStartOf(new Date(earliest+"T12:00:00"))); if(eStart<state.weekStart) state.weekStart=(eStart<minStart?minStart:eStart); }
  if(state.weekStart>cur) state.weekStart=cur; // self-heal a stray future value
  var guard=0;
  while(state.weekStart<cur && guard++<60){
    var nd=new Date(state.weekStart+"T12:00:00"); nd.setDate(nd.getDate()+7);
    closeWeek(iso(weekStartOf(nd)));
  }
  if(state.weekStart!==cur){ state.weekStart=cur; save(); } // guarantee we land on the current week
})();

/* ---------------- calculations ---------------- */
function color(k){ return getComputedStyle(document.documentElement).getPropertyValue(k.colorVar).trim(); }
function softVar(k){ return k.colorVar+"-soft"; }
function choresForKid(kid,dow){
  return state.core.filter(function(c){
    var mine = c.who==="all" || c.who===kid.id;
    return mine && (dow==null || c.days.indexOf(dow)>=0);
  });
}
function isDone(kidId,choreId,d){ return !!(state.done[kidId]&&state.done[kidId][choreId]&&state.done[kidId][choreId][d]); }
function setDone(kidId,choreId,d,v){
  state.done[kidId]=state.done[kidId]||{};
  state.done[kidId][choreId]=state.done[kidId][choreId]||{};
  if(v) state.done[kidId][choreId][d]=true; else delete state.done[kidId][choreId][d];
  save();
}
function bonusCount(kidId,bId){ return (state.counts[kidId]&&state.counts[kidId][bId])||0; }
function setBonus(kidId,bId,n){ state.counts[kidId]=state.counts[kidId]||{}; state.counts[kidId][bId]=Math.max(0,n); save(); }

function coreEarned(kidId,startISO){
  var kid=state.kids.find(function(k){return k.id===kidId;});
  var wk=weekDatesFor(startISO||state.weekStart), sum=0;
  choresForKid(kid,null).forEach(function(c){
    wk.forEach(function(d){ if(c.days.indexOf(d.dow)>=0 && isDone(kidId,c.id,d.iso)) sum+=c.value; });
  });
  return Math.round(sum*100)/100;
}
function bonusEarned(kidId){
  var sum=0; state.bonus.forEach(function(b){ sum+=b.value*bonusCount(kidId,b.id); });
  return Math.round(sum*100)/100;
}
function earned(kidId,startISO){ return Math.round((coreEarned(kidId,startISO)+bonusEarned(kidId))*100)/100; }

/* ---------------- sound ---------------- */
var AC=null;
function blip(up){
  if(!state.sound) return;
  try{
    AC=AC||new (window.AudioContext||window.webkitAudioContext)();
    var o=AC.createOscillator(), g=AC.createGain();
    o.type="sine"; o.frequency.value=up?660:392;
    o.connect(g); g.connect(AC.destination);
    g.gain.setValueAtTime(.0001,AC.currentTime);
    g.gain.exponentialRampToValueAtTime(.14,AC.currentTime+.01);
    g.gain.exponentialRampToValueAtTime(.0001,AC.currentTime+.22);
    if(up) o.frequency.exponentialRampToValueAtTime(990,AC.currentTime+.12);
    o.start(); o.stop(AC.currentTime+.24);
  }catch(e){}
}

/* ---------------- view state ---------------- */
var view={screen:"home", kid:null, ptab:"kids", pinBuf:"", pinNext:null};
var app=document.getElementById("app");

/* ================= RENDER ================= */
function render(){
  if(view.screen==="home") return renderHome();
  if(view.screen==="kid") return renderKid();
  if(view.screen==="pin") return renderPin();
  if(view.screen==="parent") return renderParent();
}

function renderHome(){
  var cards=state.kids.map(function(k){
    var col=color(k);
    return '<button class="kid-card" data-action="enter-kid" data-id="'+k.id+'" style="border-color:'+col+'22">'
      +'<div class="kid-face" style="background:var('+softVar(k)+')">'+k.emoji+'</div>'
      +'<div class="kid-name">'+esc(k.name)+'</div>'
      +'<div class="coin-badge" style="background:var('+softVar(k)+'); color:'+col+'">'+money(earned(k.id))+'</div>'
      +'<div class="kid-meta">earned this week</div>'
      +'</button>';
  }).join("");
  app.innerHTML=
    '<div class="home-head"><div class="brand">Chore Quest <span class="spark">★</span></div></div>'
    +'<div class="home-sub">'+DOWFULL[today().getDay()]+' — tap your name to see today\u2019s jobs.</div>'
    +'<div class="kid-grid">'+cards+'</div>'
    +'<button class="grown" data-action="grown">Grown-ups</button>'
    +'<div class="ver">'+VERSION+'</div>';
}

function renderKid(){
  var kid=state.kids.find(function(k){return k.id===view.kid;});
  if(!kid){ view.screen="home"; return render(); }
  var col=color(kid), dow=today().getDay();
  var todays=choresForKid(kid,dow);
  var e=earned(kid.id);

  var choreCards = todays.length? todays.map(function(c){
    var d=isDone(kid.id,c.id,iso(today()));
    return '<button class="chore'+(d?' done':'')+'" data-action="toggle" data-chore="'+c.id+'"'
      +' style="'+(d?'background:var('+softVar(kid)+')':'')+'">'
      +'<span class="box" style="'+(d?'background:'+col+';border-color:'+col:'')+'">'+(d?'✓':'')+'</span>'
      +'<span class="name"><span class="emoji">'+c.emoji+'</span>'+esc(c.name)+'</span>'
      +'<span class="pay">'+money(c.value)+'</span>'
      +'<span class="float" data-float>+'+money(c.value)+'</span>'
      +'</button>';
  }).join("") : '<div class="empty">No set jobs today — enjoy the day! 🎉 (Bonus jobs below still earn extra.)</div>';

  var bonusCards = state.bonus.map(function(b){
    var n=bonusCount(kid.id,b.id);
    return '<div class="bonus">'
      +'<div class="info"><div class="name">'+b.emoji+' '+esc(b.name)+'</div><div class="pay">'+money(b.value)+' each'+(n?' · earned '+money(b.value*n):'')+'</div></div>'
      +'<div class="stepper">'
      +'<button class="step" data-action="bminus" data-bonus="'+b.id+'">−</button>'
      +'<span class="count">'+n+'</span>'
      +'<button class="step" data-action="bplus" data-bonus="'+b.id+'">+</button>'
      +'</div></div>';
  }).join("");

  app.innerHTML=
    '<div class="bar"><button class="iconbtn" data-action="home">← Switch kid</button><div class="spacer"></div>'
    +'<button class="iconbtn" data-action="grown">⚙︎</button></div>'
    +'<div class="hero">'
      +'<div class="face" style="background:var('+softVar(kid)+')">'+kid.emoji+'</div>'
      +'<div class="who"><div class="hi">Hi, '+esc(kid.name)+'!</div><div class="day">'+DOWFULL[dow]+'</div></div>'
      +'<div class="coin"><div class="big" id="coin">'+money(e)+'</div><div class="lbl">earned this week</div></div>'
    +'</div>'
    +'<div class="section-title">Today\u2019s jobs <small>tap when you finish one</small></div>'
    +'<div class="chore-list">'+choreCards+'</div>'
    +'<div class="section-title">Bonus jobs <small>earn extra anytime</small></div>'
    +'<div class="bonus-list">'+bonusCards+'</div>';
}

/* ---------------- PARENT ---------------- */
function renderPin(){
  var dots=[0,1,2,3].map(function(i){return '<i class="'+(i<view.pinBuf.length?'f':'')+'"></i>';}).join("");
  var keys=[1,2,3,4,5,6,7,8,9].map(function(n){return '<button class="key" data-action="pk" data-n="'+n+'">'+n+'</button>';}).join("");
  app.innerHTML='<div class="bar"><button class="iconbtn" data-action="home">← Back</button></div>'
    +'<div class="center"><div class="p-title">Grown-ups only</div>'
    +'<div class="home-sub center">Enter your PIN</div>'
    +'<div class="pin-dots">'+dots+'</div>'
    +'<div class="keypad">'+keys
    +'<button class="key ghost" data-action="pk" data-n="clr">✕</button>'
    +'<button class="key" data-action="pk" data-n="0">0</button>'
    +'<button class="key ghost" data-action="pk" data-n="del">⌫</button>'
    +'</div></div>';
}

function renderParent(){
  var tabs=[["kids","Kids"],["chores","Chores"],["bonus","Bonus jobs"],["money","Money"],["settings","Settings"]]
    .map(function(t){return '<button class="tab'+(view.ptab===t[0]?' active':'')+'" data-action="ptab" data-tab="'+t[0]+'">'+t[1]+'</button>';}).join("");
  app.innerHTML='<div class="p-head"><button class="iconbtn" data-action="home">← Done</button>'
    +'<div class="p-title">Grown-ups</div></div><div class="tabs">'+tabs+'</div><div id="ptab"></div>';
  var host=document.getElementById("ptab");
  if(view.ptab==="kids") host.innerHTML=pKids();
  if(view.ptab==="chores") host.innerHTML=pChores();
  if(view.ptab==="bonus") host.innerHTML=pBonus();
  if(view.ptab==="money") host.innerHTML=pMoney();
  if(view.ptab==="settings") host.innerHTML=pSettings();
}

function pKids(){
  var rows=state.kids.map(function(k){
    return '<div class="row">'
      +'<div class="field"><label>Emoji</label><input class="in emoji" data-edit="kid-emoji" data-id="'+k.id+'" value="'+esc(k.emoji)+'"></div>'
      +'<div class="field"><label>Name</label><input class="in name" data-edit="kid-name" data-id="'+k.id+'" value="'+esc(k.name)+'"></div>'
      +(state.kids.length>1?'<button class="del" data-action="del-kid" data-id="'+k.id+'">Remove</button>':'')
      +'</div>';
  }).join("");
  return '<div class="panel"><h3>Kids</h3><p class="hint">Rename or pick an emoji for each kid.</p>'
    +rows+'<div class="row"><button class="btn add" data-action="add-kid">+ Add a kid</button></div></div>';
}

function choreRow(c){
  var days=DOW.map(function(lbl,i){return '<button class="day'+(c.days.indexOf(i)>=0?' on':'')+'" data-action="day" data-id="'+c.id+'" data-day="'+i+'">'+lbl[0]+'</button>';}).join("");
  var who='<select class="in" data-edit="core-who" data-id="'+c.id+'"><option value="all"'+(c.who==="all"?" selected":"")+'>Everyone</option>'
    +state.kids.map(function(k){return '<option value="'+k.id+'"'+(c.who===k.id?" selected":"")+'>'+esc(k.name)+'</option>';}).join("")+'</select>';
  return '<div class="row">'
    +'<input class="in emoji" data-edit="core-emoji" data-id="'+c.id+'" value="'+esc(c.emoji)+'">'
    +'<div class="field"><label>Chore</label><input class="in name" style="width:200px" data-edit="core-name" data-id="'+c.id+'" value="'+esc(c.name)+'"></div>'
    +'<div class="field"><label>Pay</label><input class="in money" type="number" step="0.05" min="0" data-edit="core-value" data-id="'+c.id+'" value="'+c.value+'"></div>'
    +'<div class="field"><label>Who</label>'+who+'</div>'
    +'<div class="field"><label>Days</label><div class="days">'+days+'</div></div>'
    +'<button class="del" data-action="del-core" data-id="'+c.id+'">Remove</button>'
    +'</div>';
}
function pChores(){
  return '<div class="panel"><h3>Core chores</h3><p class="hint">The everyday jobs. Pay is per day done, so a missed day just docks that amount. Pick which days each chore shows up, and who it\u2019s for.</p>'
    +state.core.map(choreRow).join("")
    +'<div class="row"><button class="btn add" data-action="add-core">+ Add a chore</button></div></div>';
}
function pBonus(){
  var rows=state.bonus.map(function(b){
    return '<div class="row">'
      +'<input class="in emoji" data-edit="bonus-emoji" data-id="'+b.id+'" value="'+esc(b.emoji)+'">'
      +'<div class="field"><label>Bonus job</label><input class="in name" style="width:220px" data-edit="bonus-name" data-id="'+b.id+'" value="'+esc(b.name)+'"></div>'
      +'<div class="field"><label>Pay each</label><input class="in money" type="number" step="0.25" min="0" data-edit="bonus-value" data-id="'+b.id+'" value="'+b.value+'"></div>'
      +'<button class="del" data-action="del-bonus" data-id="'+b.id+'">Remove</button></div>';
  }).join("");
  return '<div class="panel"><h3>Bonus jobs</h3><p class="hint">Extra jobs any kid can grab for more money. They tap + each time they do one.</p>'
    +rows+'<div class="row"><button class="btn add" data-action="add-bonus">+ Add a bonus job</button></div></div>';
}
function pMoney(){
  var cards=state.kids.map(function(k){
    var e=earned(k.id), inv=Math.round(e*state.investPercent)/100, keep=Math.round((e-inv)*100)/100;
    var paid=!!state.paid[k.id];
    return '<div class="mcard"><div class="mname">'+k.emoji+' '+esc(k.name)+'</div>'
      +'<div class="mline"><span>Earned</span><span class="v">'+money(e)+'</span></div>'
      +'<div class="mline"><span>Invest ('+state.investPercent+'%)</span><span class="v">'+money(inv)+'</span></div>'
      +'<div class="mline total"><span>Give them</span><span class="v">'+money(keep)+'</span></div>'
      +'<button class="btn paybtn '+(paid?'':'ghost')+'" data-action="paid" data-id="'+k.id+'">'+(paid?'✓ Paid this week':'Mark paid')+'</button>'
      +'</div>';
  }).join("");
  var deposit=state.kids.reduce(function(s,k){return s+Math.round(earned(k.id)*state.investPercent)/100;},0);

  var life='<div class="panel"><h3>Lifetime totals</h3><p class="hint">Tracking since '+monthYear(state.since)+'. Everything earned and invested so far, including this week \u2014 the invested column is the number that grows in their brokerage.</p>'
    +state.kids.map(function(k){
      var L=state.lifetime[k.id]||{earned:0,invest:0,keep:0};
      var e=earned(k.id), inv=Math.round(e*state.investPercent)/100;
      var te=Math.round((L.earned+e)*100)/100, ti=Math.round((L.invest+inv)*100)/100;
      return '<div class="mline"><span>'+k.emoji+' '+esc(k.name)+'</span><span class="v">earned '+money(te)+' · invested '+money(ti)+'</span></div>';
    }).join("")+'</div>';

  var hist=state.history.length? '<div class="panel history"><h3>Past weeks</h3><p class="hint">Saved automatically every Monday. Forgot to mark a week paid before it rolled over? Tap the button on any kid to reconcile it now.</p>'
      +state.history.map(function(h,hi){
        return '<div class="hitem"><div class="hweek">Week of '+h.ended+'<span class="hdep">deposit '+money(h.deposit)+'</span></div>'
          +h.per.map(function(p,pi){ return '<div class="hrow"><span>'+esc(p.name)+'</span>'
            +'<span class="hright">give '+money(p.keep)+' · invest '+money(p.invest)
            +' <button class="histpay '+(p.paid?'on':'')+'" data-action="histpaid" data-hi="'+hi+'" data-pi="'+pi+'">'+(p.paid?'✓ paid':'mark paid')+'</button></span></div>'; }).join("")
          +'</div>';
      }).join("")+'</div>' : '';

  return '<div class="panel"><h3>This week\u2019s money</h3><p class="hint">\u201cGive them\u201d is the cash to hand each kid; the rest goes to the brokerage. Tap Mark paid once you\u2019ve paid, so nothing slips.</p>'
    +'<div class="row" style="border:none;padding-top:4px"><div class="field"><label>Invest into brokerage</label>'
    +'<div style="display:flex;align-items:center;gap:8px"><input class="in pct" type="number" min="0" max="100" step="1" data-edit="pct" value="'+state.investPercent+'"><span style="font-weight:800;color:var(--muted)">% of earnings</span></div></div></div>'
    +'<div class="money-grid">'+cards+'</div>'
    +'<div class="deposit"><span>Total to deposit this week</span><span class="amt">'+money(deposit)+'</span></div></div>'
    +life+hist;
}
function pSettings(){
  return '<div class="panel"><h3>Settings</h3>'
    +'<div class="row"><div class="field"><label>Sound effects</label><button class="btn '+(state.sound?'':'ghost')+'" data-action="sound">'+(state.sound?"On":"Off")+'</button></div></div>'
    +'<div class="row"><div class="field"><label>Grown-ups PIN</label>'
      +(state.pin? '<button class="btn ghost" data-action="clearpin">Remove PIN ('+state.pin.length+' digits set)</button>'
                 : '<button class="btn" data-action="setpin">Set a 4-digit PIN</button>')+'</div></div>'
    +'</div>'
    +'<div class="panel"><h3>Data</h3><p class="hint">Everything lives on this iPad. Save a backup anytime.</p>'
    +'<div class="row" style="border:none"><button class="btn ghost" data-action="export">Save backup file</button>'
    +'<button class="btn ghost" data-action="import">Load backup file</button></div></div>'
    +'<div class="panel"><h3>Start a new week</h3><p class="hint">Saves this week to payday history, then clears all the checkmarks and bonus counts. Chores and kids stay put.</p>'
    +'<div class="row" style="border:none"><button class="btn warn" data-action="resetweek">Start fresh week</button></div></div>';
}

/* ================= EVENTS (delegated on stable #app) ================= */
function esc(s){ return String(s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];}); }
function toast(msg){ var t=document.getElementById("toast"); t.textContent=msg; t.classList.add("show"); clearTimeout(toast._t); toast._t=setTimeout(function(){t.classList.remove("show");},1600); }

app.addEventListener("click",function(ev){
  var el=ev.target.closest("[data-action]"); if(!el) return;
  var a=el.getAttribute("data-action");

  if(a==="enter-kid"){ view.screen="kid"; view.kid=el.getAttribute("data-id"); return render(); }
  if(a==="home"){ view.screen="home"; return render(); }
  if(a==="grown"){ if(state.pin){ view.screen="pin"; view.pinBuf=""; } else { view.screen="parent"; } return render(); }

  if(a==="toggle"){
    var kid=state.kids.find(function(k){return k.id===view.kid;}), col=color(kid);
    var cid=el.getAttribute("data-chore"), d=iso(today()), now=!isDone(view.kid,cid,d);
    setDone(view.kid,cid,d,now);
    el.classList.toggle("done",now);
    el.style.background = now ? "var("+softVar(kid)+")" : "";
    var box=el.querySelector(".box");
    box.textContent = now?"✓":""; box.style.background = now?col:""; box.style.borderColor = now?col:"";
    if(now){ el.classList.remove("pop"); void el.offsetWidth; el.classList.add("pop");
      var f=el.querySelector("[data-float]"); if(f){f.classList.remove("rise"); void f.offsetWidth; f.classList.add("rise");} blip(true); }
    else blip(false);
    refreshKidHeader(); return;
  }
  if(a==="bplus"||a==="bminus"){
    var bid=el.getAttribute("data-bonus"), n=bonusCount(view.kid,bid), nn=a==="bplus"?n+1:Math.max(0,n-1);
    if(nn===n) return;
    setBonus(view.kid,bid,nn);
    var wrap=el.closest(".bonus"); wrap.querySelector(".count").textContent=nn;
    var b=state.bonus.find(function(x){return x.id===bid;});
    wrap.querySelector(".pay").textContent = money(b.value)+" each"+(nn?" · earned "+money(b.value*nn):"");
    blip(a==="bplus"); refreshKidHeader(); return;
  }

  /* ----- parent nav ----- */
  if(a==="ptab"){ view.ptab=el.getAttribute("data-tab"); return render(); }

  if(a==="pk"){ // pin keypad
    var n=el.getAttribute("data-n");
    if(n==="clr") view.pinBuf="";
    else if(n==="del") view.pinBuf=view.pinBuf.slice(0,-1);
    else if(view.pinBuf.length<4) view.pinBuf+=n;
    if(view.pinBuf.length===4){
      if(view.pinNext==="set"){ state.pin=view.pinBuf; save(); view.pinNext=null; view.screen="parent"; view.ptab="settings"; toast("PIN set"); }
      else if(view.pinBuf===state.pin){ view.screen="parent"; }
      else { view.pinBuf=""; toast("Try again"); }
    }
    return render();
  }

  /* ----- kids crud ----- */
  if(a==="add-kid"){ var pal=["--k1","--k2","--k3"]; state.kids.push({id:uid(),name:"New kid",emoji:"⭐️",colorVar:pal[state.kids.length%3]}); save(); return render(); }
  if(a==="del-kid"){ var id=el.getAttribute("data-id"); state.kids=state.kids.filter(function(k){return k.id!==id;}); delete state.done[id]; delete state.counts[id]; delete state.paid[id]; save(); return render(); }

  /* ----- core crud ----- */
  if(a==="add-core"){ state.core.push({id:uid(),name:"New chore",emoji:"✅",value:0.25,days:[0,1,2,3,4,5,6],who:"all"}); save(); return render(); }
  if(a==="del-core"){ var cid2=el.getAttribute("data-id"); state.core=state.core.filter(function(c){return c.id!==cid2;}); Object.keys(state.done).forEach(function(kid){ if(state.done[kid]) delete state.done[kid][cid2]; }); save(); return render(); }
  if(a==="day"){ var cc=state.core.find(function(c){return c.id===el.getAttribute("data-id");}); var dy=+el.getAttribute("data-day");
    var i=cc.days.indexOf(dy); if(i>=0) cc.days.splice(i,1); else cc.days.push(dy); save(); return render(); }

  /* ----- bonus crud ----- */
  if(a==="add-bonus"){ state.bonus.push({id:uid(),name:"New bonus job",emoji:"⭐️",value:1}); save(); return render(); }
  if(a==="del-bonus"){ var bid2=el.getAttribute("data-id"); state.bonus=state.bonus.filter(function(b){return b.id!==bid2;}); Object.keys(state.counts).forEach(function(kid){ if(state.counts[kid]) delete state.counts[kid][bid2]; }); save(); return render(); }

  /* ----- settings ----- */
  if(a==="paid"){ var pid=el.getAttribute("data-id"); state.paid[pid]=!state.paid[pid]; save(); render(); return; }
  if(a==="histpaid"){ var hi=+el.getAttribute("data-hi"), pi=+el.getAttribute("data-pi"); var wk=state.history[hi]; if(wk&&wk.per[pi]){ wk.per[pi].paid=!wk.per[pi].paid; save(); render(); } return; }
  if(a==="sound"){ state.sound=!state.sound; save(); return render(); }
  if(a==="setpin"){ view.pinNext="set"; view.pinBuf=""; view.screen="pin"; return render(); }
  if(a==="clearpin"){ state.pin=""; save(); return render(); }
  if(a==="resetweek"){ if(confirm("Start a fresh week? This saves the week to Past weeks, then clears all checkmarks and bonus counts (chores and kids stay).")){ closeWeek(); toast("Fresh week started"); render(); } return; }
  if(a==="export"){ doExport(); return; }
  if(a==="import"){ doImport(); return; }
});

/* text/number/select edits: update + save, NO re-render (keeps focus, preserves typed values) */
app.addEventListener("input",function(ev){
  var el=ev.target.closest("[data-edit]"); if(!el) return;
  var e=el.getAttribute("data-edit"), id=el.getAttribute("data-id"), v=el.value;
  if(e==="kid-name"){ setk(id,"name",v); }
  else if(e==="kid-emoji"){ setk(id,"emoji",v); }
  else if(e==="core-name"){ setc(id,"name",v); }
  else if(e==="core-emoji"){ setc(id,"emoji",v); }
  else if(e==="core-value"){ setc(id,"value",parseFloat(v)||0); }
  else if(e==="bonus-name"){ setb(id,"name",v); }
  else if(e==="bonus-emoji"){ setb(id,"emoji",v); }
  else if(e==="bonus-value"){ setb(id,"value",parseFloat(v)||0); }
  else if(e==="pct"){ state.investPercent=Math.max(0,Math.min(100,parseInt(v||"0",10))); save(); }
});
app.addEventListener("change",function(ev){
  var el=ev.target.closest('[data-edit="core-who"]'); if(!el) return;
  setc(el.getAttribute("data-id"),"who",el.value); render();
});
function setk(id,f,v){ var k=state.kids.find(function(x){return x.id===id;}); if(k){k[f]=v; save();} }
function setc(id,f,v){ var c=state.core.find(function(x){return x.id===id;}); if(c){c[f]=v; save();} }
function setb(id,f,v){ var b=state.bonus.find(function(x){return x.id===id;}); if(b){b[f]=v; save();} }

function refreshKidHeader(){
  var kid=state.kids.find(function(k){return k.id===view.kid;}); if(!kid) return;
  var coin=document.getElementById("coin"); if(coin) coin.textContent=money(earned(kid.id));
}

/* ----- backup ----- */
function doExport(){
  try{
    var blob=new Blob([JSON.stringify(state,null,2)],{type:"application/json"});
    var u=URL.createObjectURL(blob), a=document.createElement("a");
    a.href=u; a.download="chore-quest-backup.json"; document.body.appendChild(a); a.click();
    setTimeout(function(){URL.revokeObjectURL(u); a.remove();},400); toast("Backup saved");
  }catch(e){ toast("Could not save backup"); }
}
function doImport(){
  var inp=document.createElement("input"); inp.type="file"; inp.accept="application/json,.json";
  inp.onchange=function(){ var f=inp.files[0]; if(!f) return; var r=new FileReader();
    r.onload=function(){ try{ var data=JSON.parse(r.result); if(data&&data.kids&&data.core){
      data.done=data.done||{}; data.counts=data.counts||{}; data.paid=data.paid||{}; data.lifetime=data.lifetime||{}; data.history=Array.isArray(data.history)?data.history:[];
      if(typeof data.investPercent!=="number") data.investPercent=50; data.since=data.since||"2026-09-01";
      data.weekStart=data.weekStart||iso(weekStartOf(today()));
      state=data; save(); toast("Backup loaded"); view.screen="parent"; view.ptab="money"; render();
    } else toast("That file didn\u2019t look right"); }catch(e){ toast("Could not read file"); } };
    r.readAsText(f); };
  inp.click();
}

render();
})();
</script>
